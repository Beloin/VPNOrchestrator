# Default spec — the baseline chain. current.yaml overrides it when valid.
# Ordered chain: node i -> node i+1; last node is the egress (internet).
# No IPs: k8s assigns addresses and each node is found by DNS (a headless
# Service named after the node).
chain:
  - name: prn
    function: printer
    setup:
      to: stdout

  - name: limiter
    function: queue
    setup:
      rate_mbps: 10
